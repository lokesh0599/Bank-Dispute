spring.application.name=DisputeIQ
server.port=8083

#-------------------------------------------MongoDB------------------------------------------------------------

spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=dispute

#--------------------------------------------Kafka-Consumer----------------------------------------------------------

spring.kafka.bootstrap-servers: localhost:9092
spring.kafka.consumer.group-id: disput
spring.kafka.consumer.auto-offest-reset: earliest
spring.kafka.consumer.key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-dveserializer: org.apache.kafka.common.serialization.StringDeserializer

#-------------------------------------------Kafka-Producer------------------------------------------------------------


spring.kafka.producer.key-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer: org.apache.kafka.common.serialization.StringSerializer

